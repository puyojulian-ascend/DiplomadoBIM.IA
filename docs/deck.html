      <g class="grid-line" opacity=".5">
        <line x1="0" y1="150" x2="1440" y2="150" />

        <line x1="960" y1="0" x2="960" y2="900" />
        <line x1="1200" y1="0" x2="1200" y2="900" />

        <path d="M-50 760 C 240 700, 420 820, 700 740 S 1180 640, 1500 720" />

  <!-- El motor inyecta las diapositivas y el chrome aquí -->

  <script src="assets/marked.min.js"></script>
  <script src="assets/deck.js"></script>
